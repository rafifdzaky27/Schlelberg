<title>Schlelberg Style Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed WebGL stage; painted UI sits on the edges like notes on a board. Single dark look by choice. */
:root {
  color-scheme: dark;
  --night: #0f0d0b;        /* stage ground */
  --ink: #16110d;          /* brush-stroke panels */
  --vellum: #eadfc8;       /* text */
  --ochre: #c8952f;        /* Tobious's mantle, the accent */
  --rust: #9a3f2b;         /* Mariya's shawl, warnings */
  --pale: #cfdde8;         /* the threshold light */
  --muted: #a99c85;
  --display: "IM Fell English SC", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --body: "Alegreya Sans", "Gill Sans", "Segoe UI", system-ui, sans-serif;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--vellum); font-family: var(--body); font-size: 15px; overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
#ui { position: fixed; inset: 0; pointer-events: none; padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-rows: auto 1fr auto; gap: 8px; }
.row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.panel { pointer-events: auto; background: linear-gradient(100deg, rgba(22,17,13,.92), rgba(22,17,13,.78) 70%, rgba(22,17,13,.55)); clip-path: polygon(0 4%, 3% 0, 97% 3%, 100% 12%, 99% 90%, 96% 100%, 4% 97%, 0 88%); padding: 12px 18px 14px; min-width: 0; }
.eyebrow { font-family: var(--display); letter-spacing: .14em; font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
button.chip { font: 500 14px/1.1 var(--body); color: var(--vellum); background: transparent; border: 1px solid rgba(234,223,200,.25); padding: 7px 12px 8px; cursor: pointer; text-align: left; border-radius: 2px; }
button.chip:hover { border-color: rgba(234,223,200,.6); }
button.chip:focus-visible { outline: 2px solid var(--ochre); outline-offset: 2px; }
button.chip[aria-pressed="true"] { background: rgba(200,149,47,.18); border-color: var(--ochre); }
button.chip kbd { font: 700 11px/1 var(--body); color: var(--ochre); margin-right: 6px; }
.chip small { display: block; color: var(--muted); font-size: 12px; margin-top: 3px; }
#blurb { margin: 8px 0 0; color: var(--muted); font-size: 13px; max-width: 46ch; }
.stack { display: grid; gap: 8px; justify-items: end; }
#center { display: grid; align-content: end; justify-items: center; gap: 10px; padding-bottom: 8px; }
#namecard { font-family: var(--display); text-align: left; background: linear-gradient(90deg, rgba(12,9,7,.9), rgba(12,9,7,.7) 75%, rgba(12,9,7,0)); padding: 10px 70px 12px 22px; clip-path: polygon(0 10%, 4% 0, 100% 18%, 92% 50%, 100% 82%, 3% 100%, 0 70%); transition: opacity .8s; }
#namecard b { display: block; font-size: 40px; font-weight: 400; letter-spacing: .08em; color: var(--vellum); line-height: 1; }
#namecard i { display: block; font-size: 17px; color: var(--pale); margin-top: 6px; letter-spacing: .06em; }
#namecard::after { content: ""; display: block; height: 3px; width: 70%; margin-top: 8px; background: linear-gradient(90deg, var(--pale), transparent); }
#subtitle { max-width: 60ch; text-align: center; font-size: 19px; line-height: 1.35; text-shadow: 0 2px 6px #000, 0 0 2px #000; min-height: 1.4em; }
#subtitle .who { display: block; font-family: var(--display); font-size: 13px; letter-spacing: .14em; color: var(--muted); }
#prompt { pointer-events: none; font-size: 15px; background: rgba(22,17,13,.82); padding: 6px 14px 7px; border-left: 3px solid var(--ochre); }
#prompt kbd, .keys kbd { font: 700 12px/1 var(--body); border: 1px solid rgba(234,223,200,.4); padding: 3px 6px; margin-right: 6px; border-radius: 3px; color: var(--vellum); background: rgba(0,0,0,.3); }
.keys { display: grid; grid-template-columns: auto auto; gap: 5px 14px; font-size: 13px; color: var(--muted); }
.keys span { color: var(--vellum); }
#state { font-family: var(--display); letter-spacing: .1em; font-size: 13px; color: var(--muted); }
#state b { color: var(--pale); font-weight: 400; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--night); font-family: var(--display); letter-spacing: .3em; color: var(--muted); transition: opacity .8s; z-index: 5; }
#rewind { position: fixed; inset: 0; pointer-events: none; opacity: 0; transition: opacity .4s; box-shadow: inset 0 0 120px 40px rgba(154,63,43,.55); }
@media (max-width: 720px) {
  .keys, #blurb { display: none; }
  #namecard b { font-size: 28px; }
  #subtitle { font-size: 16px; }
}
@media (prefers-reduced-motion: reduce) { #namecard, #loading { transition: none; } }
</style>

<div id="stage"></div>
<div id="rewind"></div>
<div id="loading">LOADING THE CHAMBER</div>
<div id="ui">
  <div class="row">
    <div class="panel">
      <p class="eyebrow">SCHLELBERG &middot; ART STYLE TEST</p>
      <div class="chips" id="styleChips">
        <button class="chip" id="st-gouache" data-style="gouache"><kbd>1</kbd>Gouache<small>Painted, like the visual bible</small></button>
        <button class="chip" id="st-sunlit" data-style="sunlit"><kbd>2</kbd>Sunlit<small>Stylized, in the spirit of Wildbrush</small></button>
        <button class="chip" id="st-grounded" data-style="grounded"><kbd>3</kbd>Grounded<small>Cinematic, closer to real</small></button>
      </div>
      <p id="blurb"></p>
    </div>
    <div class="stack">
      <div class="panel">
        <p class="eyebrow">PLACE</p>
        <div class="chips">
          <button class="chip" id="sc-chamber" data-scene="chamber"><kbd>T</kbd>The chamber</button>
          <button class="chip" id="sc-terrace" data-scene="terrace"><kbd>T</kbd>Aras terrace</button>
        </div>
        <p class="eyebrow" style="margin-top:10px">CAMERA</p>
        <div class="chips">
          <button class="chip" id="cam-fixed" data-cam="fixed"><kbd>C</kbd>Fixed</button>
          <button class="chip" id="cam-follow" data-cam="follow"><kbd>C</kbd>Follow</button>
        </div>
        <p class="eyebrow" style="margin-top:10px">IWANG MODEL</p>
        <div class="chips">
          <button class="chip" id="iw-code" data-iwang="code"><kbd>M</kbd>Built in code</button>
          <button class="chip" id="iw-tripo" data-iwang="tripo"><kbd>M</kbd>Tripo</button>
        </div>
      </div>
      <div id="state"></div>
    </div>
  </div>
  <div id="center">
    <div id="namecard" style="opacity:0"><b>IWANG</b><i>The Hollow Ones</i></div>
    <div id="subtitle"></div>
    <div id="prompt" hidden></div>
  </div>
  <div class="row">
    <div class="panel keys" id="keys">
      <kbd>W A S D</kbd><span>Walk</span>
      <kbd>E</kbd><span>Act (the clamp)</span>
      <kbd>Space</kbd><span>Close the door</span>
      <kbd>Enter</kbd><span>Skip the echo</span>
      <kbd>R</kbd><span>Reset the scene</span>
      <kbd>Drag</kbd><span>Turn the follow camera</span>
      <kbd>Q</kbd><span>Quality high / low</span>
      <kbd>H</kbd><span>Hide this panel</span>
    </div>
  </div>
</div>

<script type="importmap">

  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

} }
</script>
<script type="module" src="js/main.js"></script>
